# 풀이 시각화 사이트를 빌드해 GitHub Pages에 배포한다.
# 사용 전 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 설정
name: 풀이 지도 배포

on:
  push:
    branches: [main]
    paths:
      - 'untitled/src/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 풀이 날짜를 git 기록에서 읽으므로 전체 기록이 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
