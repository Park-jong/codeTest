// ───────── 자바 하이라이터 ─────────
const JKW = new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record true false null'.split(' '));
function highlight(src) {
  const out = []; let line = '';
  const push = (cls, text) => {
    const parts = text.split('\n');
    parts.forEach((part, i) => {
      if (i > 0) { out.push(line); line = ''; }
      if (part) line += cls ? `<span class="${cls}">${esc(part)}</span>` : esc(part);
    });
  };
  const re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|(@\w+)|(\b\d[\d_]*(?:\.\d+)?[lLfFdD]?\b|\b0[xX][\da-fA-F_]+\b)|([A-Za-z_$][\w$]*)(\s*\()?|(\s+)|([^\sA-Za-z_$\d"'\/@]+|\/)/g;
  let m;
  while ((m = re.exec(src))) {
    if (m[1] || m[2]) push('tk-co', m[0]);
    else if (m[3] || m[4]) push('tk-st', m[0]);
    else if (m[5]) push('tk-an', m[0]);
    else if (m[6]) push('tk-nu', m[0]);
    else if (m[7]) {
      const w = m[7];
      if (JKW.has(w)) push('tk-kw', w);
      else if (m[8]) push('tk-fn', w);
      else if (/^[A-Z]/.test(w) && !/^[A-Z0-9_]+$/.test(w)) push('tk-ty', w);
      else push('', w);
      if (m[8]) push('', m[8]);
    }
    else push('', m[0]);
  }
  out.push(line);
  return out;
}

// ───────── 호출 구조도 ─────────
function callGraph(p) {
  const own = p.methods.filter(m => m.owner === p.mainClass && !m.ctor);
  const names = [...new Set(own.map(m => m.name))];
  if (!names.length) return '<p class="muted" style="margin:0;font-size:13px">메서드를 찾지 못했습니다.</p>';
  const info = Object.fromEntries(names.map(n => {
    const ms = own.filter(m => m.name === n);
    return [n, { name: n, line: ms[0].line, size: ms.reduce((s, m) => s + m.size, 0), over: ms.length }];
  }));
  const edges = p.calls.filter(e => info[e.from] && info[e.to]);
  const entry = names.find(n => n === 'main') || names.find(n => n === 'solution') || names[0];
  const level = { [entry]: 0 };
  const q = [entry];
  while (q.length) {
    const n = q.shift();
    for (const e of edges) if (e.from === n && level[e.to] == null) { level[e.to] = level[n] + 1; q.push(e.to); }
  }
  const maxLv = Math.max(...Object.values(level));
  const orphans = names.filter(n => level[n] == null);
  // 행 구성 (한 행에 최대 3개)
  const rows = [];
  for (let lv = 0; lv <= maxLv; lv++) {
    const ns = names.filter(n => level[n] === lv).sort((a, b) => info[a].line - info[b].line);
    for (let i = 0; i < ns.length; i += 3) rows.push({ ns: ns.slice(i, i + 3), orphan: false });
  }
  for (let i = 0; i < orphans.length; i += 3) rows.push({ ns: orphans.slice(i, i + 3), orphan: true });

  const W = 344, NH = 40, GAP_Y = 30, PAD = 8, LOOP = 18;
  const pos = {};
  rows.forEach((r, ri) => {
    const cols = r.ns.length;
    const avail = W - PAD * 2 - LOOP;
    const cw = avail / cols;
    r.ns.forEach((n, ci) => {
      const nw = Math.min(cw - 12, Math.max(78, n.length * 7.6 + 26));
      const cx = PAD + cw * ci + cw / 2;
      pos[n] = { x: cx - nw / 2, y: PAD + ri * (NH + GAP_Y), w: nw, h: NH, row: ri, orphan: r.orphan };
    });
  });
  const H = PAD * 2 + rows.length * (NH + GAP_Y) - GAP_Y + (orphans.length ? 18 : 0);
  if (orphans.length) {
    const firstOrphanRow = rows.findIndex(r => r.orphan);
    for (const n of names) if (pos[n].row >= firstOrphanRow) pos[n].y += 18;
  }
  let s = `<svg class="graph-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="메서드 호출 구조도">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--axis)"/></marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker></defs>`;
  if (orphans.length) {
    const y = pos[orphans[0]].y - 14;
    s += `<text class="sz" x="${PAD}" y="${y}">진입점에서 직접 호출되지 않는 메서드</text>`;
  }
  for (const e of edges) {
    const a = pos[e.from], b = pos[e.to];
    if (e.from === e.to) {
      const x = a.x + a.w, y = a.y + 10;
      s += `<path class="edge self" data-f="${esc(e.from)}" data-t="${esc(e.to)}" d="M${x},${y} C${x + 22},${y - 8} ${x + 22},${y + 28} ${x + 1},${y + 20}" marker-end="url(#ahs)"/>`;
      continue;
    }
    const ax = a.x + a.w / 2, bx = b.x + b.w / 2;
    let d;
    if (b.y > a.y) {
      const y1 = a.y + a.h, y2 = b.y - 2, my = (y1 + y2) / 2;
      d = `M${ax},${y1} C${ax},${my} ${bx},${my} ${bx},${y2}`;
    } else if (b.y === a.y) {
      const dir = bx > ax ? 1 : -1;
      const x1 = dir > 0 ? a.x + a.w : a.x, x2 = dir > 0 ? b.x - 2 : b.x + b.w + 2, y = a.y + a.h / 2;
      d = `M${x1},${y} C${(x1 + x2) / 2},${y - 18} ${(x1 + x2) / 2},${y - 18} ${x2},${y}`;
    } else {
      const x1 = a.x, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
      const cx = Math.min(x1, x2) - 22;
      d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2 - 2},${y2}`;
    }
    s += `<path class="edge" data-f="${esc(e.from)}" data-t="${esc(e.to)}" d="${d}" marker-end="url(#ah)"/>`;
  }
  const recSet = new Set(edges.filter(e => e.from === e.to).map(e => e.from));
  for (const n of names) {
    const a = pos[n], inf = info[n];
    const cls = ['node', n === entry ? 'entry' : '', a.orphan ? 'orphan' : '', recSet.has(n) ? 'rec' : ''].join(' ');
    const maxChars = Math.floor((a.w - 16) / 7.4);
    const shown = n.length > maxChars ? n.slice(0, maxChars - 1) + '…' : n;
    s += `<g class="${cls}" data-m="${esc(n)}" data-line="${inf.line}" tabindex="0">
      <rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="8"/>
      <text x="${a.x + a.w / 2}" y="${a.y + 17}" text-anchor="middle">${esc(shown)}</text>
      <text class="sz" x="${a.x + a.w / 2}" y="${a.y + 31}" text-anchor="middle">${inf.size}줄${inf.over > 1 ? ` · ${inf.over}개 오버로드` : ''}${recSet.has(n) ? ' · 재귀' : ''}</text>
    </g>`;
  }
  return s + '</svg>';
}

// ───────── 상세 ─────────
function renderDetail(p) {
  const idx = sortedByDate.indexOf(p);
  const prev = sortedByDate[idx - 1], next = sortedByDate[idx + 1];
  const techs = [...p.techs].sort((a, b) => (p.explicit.includes(b) - p.explicit.includes(a)) || ((p.evidence[b]?.length ? 1 : 0) - (p.evidence[a]?.length ? 1 : 0)));
  const ownMethods = p.methods.filter(m => !m.ctor);
  const msgDiffers = p.commitMsg && !p.commitMsg.replace(/\s/g, '').includes(p.title.replace(/\s/g, ''));
  const orderLabel = idx >= 0 ? `${idx + 1}번째로 푼 문제` : '';

  app.innerHTML = `
    <a class="crumb" href="#/list"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>문제 목록</a>
    <div class="detail-head">
      <div class="row1"><span class="plat">${platName(p)}</span>${p.num != null ? `<span class="muted" style="font-variant-numeric:tabular-nums">${p.num}번</span>` : ''}
        ${p.platform === 'boj' && p.num != null ? `<a class="ext" href="https://www.acmicpc.net/problem/${p.num}" target="_blank" rel="noopener">문제 보기 ↗</a>` : ''}</div>
      <h1>${esc(p.title)}</h1>
      <div class="facts">
        <span>처음 커밋 <b>${fmtDate(p.first)}</b></span>
        ${p.commits > 1 ? `<span>수정 <b>${p.commits - 1}</b>회 (마지막 ${fmtDate(p.last)})</span>` : ''}
        <span>코드 <b>${p.loc}</b>줄</span>
        <span>메서드 <b>${ownMethods.length}</b>개</span>
        <span>반복문 최대 <b>${p.loopDepth}</b>중 중첩</span>
        ${p.io.length ? `<span>입출력 <b>${p.io.join(', ')}</b></span>` : ''}
        ${orderLabel ? `<span class="muted">${orderLabel}</span>` : ''}
      </div>
      ${msgDiffers ? `<div class="note">커밋 메모: ${esc(p.commitMsg)}</div>` : ''}
    </div>
    <div class="detail">
      <div class="side">
        <div class="card"><div class="card-h"><h2>사용한 기법</h2><span class="hint">누르면 근거 줄 표시</span></div>
          <div class="card-b">${techs.length ? `<div class="tech-list">${techs.map(t => {
            const ev = p.evidence[t] || [], tagged = p.explicit.includes(t);
            const srcLabel = tagged && ev.length ? '태그 + 감지' : tagged ? '직접 태그' : '자동 감지';
            return `<button class="tech-item" data-t="${t}" aria-pressed="false"${ev.length ? '' : ' data-noev="1"'}>
              <div class="top"><span class="dot${tagged ? '' : ' hollow'}"></span><span class="nm">${esc(tname(t))}</span><span class="src">${srcLabel}</span></div>
              <div class="tech-desc">${esc(TECH_DESC[t] || '')}</div>
              ${ev.length ? `<div class="lines">${ev.slice(0, 10).map(l => `<span>L${l}</span>`).join('')}${ev.length > 10 ? `<span>+${ev.length - 10}</span>` : ''}</div>` : ''}
            </button>`; }).join('')}</div>` : '<p class="muted" style="margin:0;font-size:13.5px">코드 패턴으로 감지된 기법이 없습니다. 구현·수학 계열 문제일 가능성이 큽니다.</p>'}
          ${p.extraTags.length ? `<div class="chips" style="margin-top:10px">${p.extraTags.map(t => `<span class="chip tagged">${esc(t)}</span>`).join('')}</div>` : ''}
          </div></div>
        <div class="card"><div class="card-h"><h2>호출 구조도</h2><span class="hint">노드를 누르면 코드로</span></div>
          <div class="card-b">${callGraph(p)}
            <div class="graph-legend"><span><i style="background:var(--accent)"></i>진입점</span><span><i style="border:1.5px solid var(--accent)"></i>재귀 메서드</span><span><i style="border:1px dashed var(--axis)"></i>호출 경로 밖</span></div>
          </div></div>
        ${p.fields.length ? `<div class="card"><div class="card-h"><h2>전역 상태</h2><span class="hint">클래스 필드 ${p.fields.length}개</span></div>
          <div class="card-b"><div class="kv">${p.fields.map(f => `<button data-line="${f.line}"><span class="ty">${esc(f.type)}</span><span>${esc(f.name)}</span><span class="ln">L${f.line}</span></button>`).join('')}</div></div></div>` : ''}
        ${p.classes.length ? `<div class="card"><div class="card-h"><h2>직접 만든 타입</h2></div>
          <div class="card-b"><div class="kv">${p.classes.map(c => `<button data-line="${c.line}" data-end="${c.endLine}"><span class="ty">${esc(c.kind)}</span><span>${esc(c.name)}</span><span class="ln">L${c.line}–${c.endLine}</span></button>`).join('')}</div></div></div>` : ''}
      </div>
      <div class="card code-card">
        <div class="code-bar"><span class="fname">${esc(p.file)}</span><span class="sel" id="sel"></span></div>
        <div class="code-scroll" id="codeScroll"><pre class="code" id="code"></pre></div>
      </div>
    </div>
    <div class="pager">
      ${prev ? `<a class="card" href="${href(prev)}"><div class="dir">← 이전에 푼 문제 · ${fmtDate(prev.first)}</div><div class="nm">${esc(label(prev))}</div></a>` : '<span></span>'}
      ${next ? `<a class="card" href="${href(next)}" style="text-align:right"><div class="dir">다음에 푼 문제 · ${fmtDate(next.first)} →</div><div class="nm">${esc(label(next))}</div></a>` : '<span></span>'}
    </div>`;

  // 코드 렌더
  const hl = highlight(p.source);
  const starts = new Set(p.methods.map(m => m.line));
  $('#code').innerHTML = hl.map((h, i) => `<div class="cl${starts.has(i + 1) ? ' mstart' : ''}" data-l="${i + 1}"><span class="no">${i + 1}</span><span class="tx">${h || ' '}</span></div>`).join('');
  const lineEl = n => $(`#code .cl[data-l="${n}"]`);
  const scroller = $('#codeScroll');
  const scrollToLine = n => {
    const el = lineEl(n); if (!el) return;
    scroller.scrollTo({ top: el.offsetTop - scroller.clientHeight / 3, behavior: 'smooth' });
    if (matchMedia('(max-width: 980px)').matches) $('.code-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  const clearMarks = () => document.querySelectorAll('#code .cl.hl, #code .cl.inrange').forEach(e => e.classList.remove('hl', 'inrange'));
  const setRange = (a, b, title) => {
    clearMarks();
    for (let i = a; i <= b; i++) lineEl(i)?.classList.add('inrange');
    $('#sel').textContent = title || '';
  };
  const flash = n => { const el = lineEl(n); if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); };

  app.querySelectorAll('.tech-item').forEach(b => b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') === 'true';
    app.querySelectorAll('.tech-item').forEach(x => x.setAttribute('aria-pressed', 'false'));
    clearMarks(); $('#sel').textContent = '';
    if (on) return;
    b.setAttribute('aria-pressed', 'true');
    const ev = p.evidence[b.dataset.t] || [];
    if (!ev.length) { $('#sel').textContent = '파일명·커밋 태그로만 표시됨'; return; }
    ev.forEach(l => lineEl(l)?.classList.add('hl'));
    $('#sel').textContent = `${tname(b.dataset.t)} · 근거 ${ev.length}줄`;
    scrollToLine(ev[0]);
  }));
  app.querySelectorAll('.graph-svg .node').forEach(g => {
    const go = () => {
      const name = g.dataset.m;
      const ms = p.methods.filter(m => m.name === name && m.owner === p.mainClass && !m.ctor);
      app.querySelectorAll('.tech-item').forEach(x => x.setAttribute('aria-pressed', 'false'));
      clearMarks();
      ms.forEach(m => { for (let i = m.line; i <= m.endLine; i++) lineEl(i)?.classList.add('inrange'); });
      $('#sel').textContent = `${name}() · L${ms[0].line}–${ms[0].endLine}`;
      scrollToLine(ms[0].line); flash(ms[0].line);
    };
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    g.addEventListener('mouseenter', ev => {
      app.querySelectorAll('.graph-svg .edge').forEach(e => e.classList.toggle('hl', e.dataset.f === g.dataset.m || e.dataset.t === g.dataset.m));
      const name = g.dataset.m;
      const callers = [...new Set(p.calls.filter(e => e.to === name && e.from !== name).map(e => e.from))];
      const callees = [...new Set(p.calls.filter(e => e.from === name && e.to !== name).map(e => e.to))];
      const m = p.methods.find(x => x.name === name && x.owner === p.mainClass);
      showTip(`<b>${esc(m.ret)} ${esc(name)}(${esc(m.params)})</b>${callers.length ? '<br>호출하는 곳: ' + esc(callers.join(', ')) : ''}${callees.length ? '<br>부르는 메서드: ' + esc(callees.join(', ')) : ''}`, ev);
    });
    g.addEventListener('mousemove', ev => showTip(tip.innerHTML, ev));
    g.addEventListener('mouseleave', () => { hideTip(); app.querySelectorAll('.graph-svg .edge.hl').forEach(e => e.classList.remove('hl')); });
  });
  app.querySelectorAll('.kv button').forEach(b => b.addEventListener('click', () => {
    const a = Number(b.dataset.line), e = Number(b.dataset.end || a);
    app.querySelectorAll('.tech-item').forEach(x => x.setAttribute('aria-pressed', 'false'));
    setRange(a, e, b.textContent.replace(/\s+/g, ' ').trim());
    scrollToLine(a); flash(a);
  }));
}

route();
</script>
</body>
</html>
