<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>풀이 지도</title>
<style>
:root {
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42,120,214,0.10);
  --accent-wash-2: rgba(42,120,214,0.20);
  --heat-0: #ecebe6;
  --heat-1: #b7d3f6;
  --heat-2: #6da7ec;
  --heat-3: #2a78d6;
  --heat-4: #104281;
  --on-accent: #ffffff;
  --code-kw: #a3367a;
  --code-type: #1c5cab;
  --code-str: #3c7a1e;
  --code-num: #a25a00;
  --code-com: #898781;
  --code-fn: #6a3fb5;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  --radius: 12px;
  --mono: "JetBrains Mono", "D2Coding", Consolas, "SF Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57,135,229,0.14); --accent-wash-2: rgba(57,135,229,0.28);
    --heat-0: #262624; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
    --code-kw: #e48bc4; --code-type: #86b6ef; --code-str: #9ccf7c; --code-num: #f0b26b; --code-com: #7d7c76; --code-fn: #c2a5f2;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57,135,229,0.14); --accent-wash-2: rgba(57,135,229,0.28);
  --heat-0: #262624; --heat-1: #184f95; --heat-2: #256abf; --heat-3: #3987e5; --heat-4: #86b6ef;
  --code-kw: #e48bc4; --code-type: #86b6ef; --code-str: #9ccf7c; --code-num: #f0b26b; --code-com: #7d7c76; --code-fn: #c2a5f2;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* 상단바 */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; gap: 20px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }
nav.tabs { display: flex; gap: 2px; }
nav.tabs a { text-decoration: none; padding: 6px 12px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
nav.tabs a:hover { background: var(--surface-2); color: var(--ink); }
nav.tabs a[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.top-search { margin-left: auto; position: relative; flex: 0 1 280px; }
.top-search input { width: 100%; height: 36px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); padding: 0 12px 0 34px; font: inherit; color: var(--ink); }
.top-search svg { position: absolute; left: 11px; top: 10px; color: var(--muted); }
.icon-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); flex: none; }
.icon-btn:hover { color: var(--ink); }
@media (max-width: 720px) {
  header.top .wrap { gap: 10px; }
  .brand span.name { display: none; }
  .top-search { flex: 1 1 auto; }
  nav.tabs a { padding: 6px 8px; }
}
nav.tabs a { white-space: nowrap; }
.top-search { min-width: 0; }
@media (max-width: 640px) {
  .top-search { display: none; }
  #theme { margin-left: auto; }
  h1 { font-size: 22px; }
  .kpi .value { font-size: 24px; }
  .tech-row { grid-template-columns: 104px minmax(0, 1fr) 30px; }
  .filters input[type="search"] { width: 100%; }
}

main { padding: 28px 0 64px; }
h1 { font-size: 26px; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.005em; }
.sub { color: var(--ink-2); margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.card-h .hint { color: var(--muted); font-size: 13px; }
.card-b { padding: 14px 18px 18px; }
.grid { display: grid; gap: 16px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }

/* KPI */
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 4px; }
.kpi .value small { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.kpi .foot { color: var(--muted); font-size: 13px; margin-top: 2px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* 히트맵 */
.heat-scroll { overflow-x: auto; padding-bottom: 4px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: 16px repeat(7, 12px); gap: 3px; width: max-content; }
.heat .cell { width: 12px; height: 12px; border-radius: 3px; background: var(--heat-0); cursor: default; }
.heat .cell[data-n] { cursor: pointer; }
.heat .cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.heat .mlabel { font-size: 11px; color: var(--muted); white-space: nowrap; height: 16px; line-height: 12px; }
.heat .pad { width: 12px; height: 12px; }
.heat-wrap { display: flex; gap: 6px; }
.heat-days { display: grid; grid-template-rows: 16px repeat(7, 12px); gap: 3px; font-size: 10px; color: var(--muted); line-height: 12px; }
.legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* 막대 */
.bars-svg { width: 100%; display: block; }
.bars-svg text { font: 11px var(--sans); fill: var(--muted); }
.bars-svg .gl { stroke: var(--grid); stroke-width: 1; }
.bars-svg .base { stroke: var(--axis); stroke-width: 1; }
.bars-svg .bar { fill: var(--accent); }
.bars-svg .hit:hover + .bar, .bars-svg .bar.on { fill: var(--accent-ink); }

.tech-bars { display: flex; flex-direction: column; gap: 2px; }
.tech-row { display: grid; grid-template-columns: 128px minmax(0, 1fr) 34px; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 7px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.tech-row:hover { background: var(--surface-2); }
.tech-row .nm { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tech-row .track { height: 10px; border-radius: 0 4px 4px 0; position: relative; }
.tech-row .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 3px; }
.tech-row .ct { font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; color: var(--ink-2); }

/* 칩 */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; border: 1px solid var(--border); color: var(--ink-2); background: var(--surface); }
.chip.tagged { background: var(--accent-wash); border-color: transparent; color: var(--accent-ink); font-weight: 550; }
.chip.more { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.plat { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }

/* 목록 */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); font-weight: 550; }
select, .filters input[type="search"] { height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; padding: 0 10px; }
.filters input[type="search"] { width: 240px; max-width: 100%; }
.tech-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.tf { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; height: 30px; padding: 0 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.tf:hover { color: var(--ink); border-color: var(--axis); }
.tf[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tf .n { font-variant-numeric: tabular-nums; opacity: 0.7; font-size: 12px; }
.result-meta { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.linkish { border: 0; background: none; color: var(--accent-ink); cursor: pointer; padding: 0; font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.pcard { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; text-decoration: none; transition: border-color .12s, transform .12s; }
.pcard:hover { border-color: var(--accent); }
.pcard .t { font-weight: 650; font-size: 15.5px; letter-spacing: -0.01em; line-height: 1.35; }
.pcard .row { display: flex; align-items: center; gap: 8px; }
.pcard .num { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }
.pcard .meta { display: flex; gap: 12px; color: var(--muted); font-size: 12.5px; margin-top: auto; font-variant-numeric: tabular-nums; }
.empty { padding: 48px; text-align: center; color: var(--muted); }

/* 상세 */
.crumb { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); text-decoration: none; font-size: 14px; margin-bottom: 12px; }
.crumb:hover { color: var(--ink); }
.detail-head { margin-bottom: 18px; }
.detail-head .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13.5px; margin-top: 10px; }
.facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.note { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; display: inline-block; }
.ext { color: var(--accent-ink); text-decoration: none; font-size: 13.5px; font-weight: 550; }
.ext:hover { text-decoration: underline; }
.detail { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
.detail .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 980px) { .detail { grid-template-columns: minmax(0, 1fr); } }

.tech-list { display: flex; flex-direction: column; gap: 4px; }
.tech-item { border-radius: 9px; padding: 8px 10px; cursor: pointer; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.tech-item:hover { background: var(--surface-2); }
.tech-item[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent-wash-2); }
.tech-item .top { display: flex; align-items: center; gap: 8px; }
.tech-item .nm { font-weight: 600; font-size: 14px; }
.tech-item .src { font-size: 11.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.tech-item .lines { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tech-item .lines span { font: 11.5px var(--mono); color: var(--ink-2); background: var(--surface-2); border-radius: 5px; padding: 1px 6px; }
.tech-item[aria-pressed="true"] .lines span { background: var(--surface); }
.tech-desc { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.hollow { background: transparent; border: 2px solid var(--accent); }

.graph-svg { width: 100%; display: block; }
.graph-svg .node rect { fill: var(--surface-2); stroke: var(--border); stroke-width: 1; }
.graph-svg .node.entry rect { fill: var(--accent); stroke: var(--accent); }
.graph-svg .node.entry text { fill: var(--on-accent); }
.graph-svg .node.entry text.sz { fill: var(--on-accent); opacity: 0.8; }
.graph-svg .node.orphan rect { stroke-dasharray: 4 3; stroke: var(--axis); fill: transparent; }
.graph-svg .node.rec rect { stroke: var(--accent); stroke-width: 1.5; }
.graph-svg .node { cursor: pointer; }
.graph-svg .node:hover rect { stroke: var(--ink); }
.graph-svg text { font: 600 12px var(--mono); fill: var(--ink); }
.graph-svg text.sz { font: 10.5px var(--sans); fill: var(--muted); }
.graph-svg .edge { fill: none; stroke: var(--axis); stroke-width: 1.5; }
.graph-svg .edge.self { stroke: var(--accent); }
.graph-svg .edge.hl { stroke: var(--ink); }
.graph-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.graph-legend span { display: inline-flex; align-items: center; gap: 5px; }
.graph-legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }

.kv { display: flex; flex-direction: column; gap: 2px; }
.kv button { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 6px; border: 0; background: none; cursor: pointer; text-align: left; font: 12.5px var(--mono); width: 100%; }
.kv button:hover { background: var(--surface-2); }
.kv .ty { color: var(--code-type); }
.kv .ln { margin-left: auto; color: var(--muted); font-size: 11px; }

.code-card { position: sticky; top: 76px; display: flex; flex-direction: column; max-height: calc(100vh - 92px); overflow: hidden; }
@media (max-width: 980px) { .code-card { position: static; max-height: 75vh; } }
.code-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); font: 12.5px var(--mono); color: var(--ink-2); flex: none; }
.code-bar .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code-bar .sel { margin-left: auto; font-family: var(--sans); color: var(--accent-ink); white-space: nowrap; font-size: 12.5px; }
.code-scroll { overflow: auto; flex: 1; }
pre.code { margin: 0; padding: 8px 0 16px; font: 12.8px/1.65 var(--mono); tab-size: 4; min-width: max-content; }
.cl { display: flex; padding-right: 18px; }
.cl .no { width: 52px; flex: none; text-align: right; padding-right: 14px; color: var(--muted); user-select: none; opacity: 0.75; border-right: 3px solid transparent; margin-right: 12px; }
.cl.mstart .no { color: var(--ink-2); opacity: 1; }
.cl.inrange { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.cl.hl { background: var(--accent-wash-2); }
.cl.hl .no { border-right-color: var(--accent); color: var(--accent-ink); opacity: 1; }
.cl.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { background: var(--accent-wash-2); } 100% { background: transparent; } }
.tk-kw { color: var(--code-kw); }
.tk-ty { color: var(--code-type); }
.tk-st { color: var(--code-str); }
.tk-nu { color: var(--code-num); }
.tk-co { color: var(--code-com); font-style: italic; }
.tk-fn { color: var(--code-fn); }
.tk-an { color: var(--code-num); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
.pager a { flex: 1; max-width: 48%; padding: 12px 14px; text-decoration: none; }
.pager a:hover { border-color: var(--accent); }
.pager .dir { font-size: 12px; color: var(--muted); }
.pager .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.recent { display: flex; flex-direction: column; }
.recent a { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; text-decoration: none; }
.recent a:hover { background: var(--surface-2); }
.recent .d { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.recent .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550; font-size: 14px; }

#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12.5px; padding: 7px 10px; border-radius: 8px; max-width: 280px; opacity: 0; transition: opacity .08s; line-height: 1.45; }
#tip b { font-weight: 650; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">
      <span class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 8 11 16M16.5 8 13 16"/></svg></span>
      <span class="name">풀이 지도</span>
    </a>
    <nav class="tabs">
      <a href="#/" data-nav="home">대시보드</a>
      <a href="#/list" data-nav="list">문제 목록</a>
    </nav>
    <label class="top-search">
      <span class="vh">문제 검색</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gsearch" type="search" placeholder="번호, 제목, 기법 검색" autocomplete="off">
    </label>
    <button class="icon-btn" id="theme" title="테마 전환" aria-label="테마 전환">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>

                cities.append(i + 1).append(\" \");\n            }\n        }\n        return cities.toString();\n    }\n}"},{"id":"Main_2194_유닛이동시키기","file":"Main_2194_유닛이동시키기.java","platform":"boj","num":2194,"title":"유닛이동시키기","extraTags":[],"explicit":[],"techs":["bfs","grid"],"evidence":{"bfs":[42,48,55],"grid":[45,46]},"first":"2025-10-25","last":"2025-10-25","commits":1,"commitMsg":"2194_유닛이동시키기","loc":68,"lines":73,"loopDepth":3,"io":["BufferedReader","BufferedWriter"],"mainClass":"Main_2194_","methods":[{"name":"main","ret":"void","params":"String[] args","line":8,"endLine":38,"owner":"Main_2194_","ctor":false,"size":31},{"name":"findPath","ret":"int","params":"int n, int m, int a, int b, boolean[][] wall, Position start, Position goal","line":40,"endLine":60,"owner":"Main_2194_","ctor":false,"size":21},{"name":"Position","ret":"","params":"int x, int y, int time","line":67,"endLine":71,"owner":"Position","ctor":true,"size":5}],"classes":[{"kind":"class","name":"Position","line":62,"endLine":72}],"calls":[{"from":"main","to":"findPath","lines":[34]}],"fields":[],"source":"import java.io.*;\nimport java.util.ArrayDeque;\nimport java.util.Queue;\nimport java.util.StringTokenizer;\n\npublic class Main_2194_유닛이동시키기 {\n\n    public static void main(String[] args) throws IOException {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        BufferedWriter bw = new BufferedWriter(new OutputStreamWriter(System.out));\n        StringTokenizer st = new StringTokenizer(br.readLine());\n        int n = Integer.parseInt(st.nextToken());\n        int m = Integer.parseInt(st.nextToken());\n        int a = Integer.parseInt(st.nextToken());\n        int b = Integer.parseInt(st.nextToken());\n        int k = Integer.parseInt(st.nextToken());\n        boolean[][] wall = new boolean[n + 1][m + 1];\n        for (int i = 0; i \u003c k; i++) {\n            st = new StringTokenizer(br.readLine());\n            int x = Integer.parseInt(st.nextToken {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        BufferedWriter bw = new BufferedWriter(new OutputStreamWriter(System.out));\n        StringTokenizer st = new StringTokenizer(br.readLine());\n        n = Integer.parseInt(st.nextToken());\n        m = Integer.parseInt(st.nextToken());\n        int[][] before = new int[n][m];\n        int[][] after = new int[n][m];\n        for (int i = 0; i \u003c n; i++) {\n            st = new StringTokenizer(br.readLine());\n            for (int j = 0; j \u003c m; j++) {\n                before[i][j] = Integer.parseInt(st.nextToken());\n            }\n        }\n        for (int i = 0; i \u003c n; i++) {\n            st = new StringTokenizer(br.readLine());\n            for (int j = 0; j \u003c m; j++) {\n                after[i][j] = Integer.parseInt(st.nextToken());\n            }\n        }\n        String result = isPossible(before, after) ? \"YES\" : \"NO\";\n        bw.write(result);\n        bw.close();\n        br.close();\n    }\n\n    static boolean isPossible(int[][] before, int[][] after) {\n        boolean[][] isVisited = new boolean[n][m];\n        set = new int[n][m];\n        int index = 0;\n        for (int i = 0; i \u003c n; i++) {\n            for (int j = 0; j \u003c m; j++) {\n                if (isVisited[i][j]) continue;\n                makeSet(i, j, isVisited, before, ++index);\n            }\n        }\n        int beforeSet = -1;\n        for (int i = 0; i \u003c n; i++) {\n            for (int j = 0; j \u003c m; j++) {\n                if (before[i][j] == after[i][j]) continue;\n                if (beforeSet == -1) {\n                    if (!isNormal(i, j, before, after)) return false;\n                    beforeSet = set[i][j];\n                } else if (beforeSet != set[i][j]) return false;\n\n            }\n        }\n        return true;\n    }\n\n    static void makeSet(int x, int y, boolean[][] isVisited, int[][] before, int index) {\n        Queue\u0      if (dp[course.a] \u003c 0) {\n                continue;\n            }\n            dp[course.b] = Math.max(dp[course.a] + course.time, dp[course.b]);\n        }\n    }\n\n    static void takeLift(long[][] dp, int lift) {\n        if (lift == k) {\n            return;\n        }\n        for (int i = 0; i \u003c m; i++) {\n            Course course = courses[i];\n            if (dp[lift][course.b] \u003c 0) {\n                continue;\n            }\n            dp[lift + 1][course.a] = Math.max(dp[lift][course.b], dp[lift + 1][course.a]);\n        }\n    }\n\n    static long findMaxValue(long[][] dp) {\n        long max = -1;\n        for (int i = 0; i \u003c= k; i++) {\n            max = Math.max(dp[i][goal], max);\n        }\n        return max;\n    }\n\n    static class Course {\n        int a;\n        int b;\n        long time;\n\n        Course(int a, int b, long time) {\n            this.a = a;\n            this.b = b;\n            this.time = time;\n        }\n    }\n}"},{"id":"Main_2240_자두나무","file":"Main_2240_자두나무.java","platform":"boj","num":2240,"title":"자두나무","extraTags":[],"explicit":[],"techs":["dp"],"evidence":{"dp":[27,29,35]},"first":"2025-08-29","last":"2025-08-29","commits":1,"commitMsg":"2240_자두나무","loc":36,"lines":39,"loopDepth":2,"io":["BufferedReader","BufferedWriter"],"mainClass":"Main_2240_","methods":[{"name":"main","ret":"void","params":"String[] args","line":6,"endLine":20,"owner":"Main_2240_","ctor":false,"size":15},{"name":"maxCount","ret":"int","params":"int t, int w, int[] jadoo","line":22,"endLine":38,"owner":"Main_2240_","ctor":false,"size":17}],"classes":[],"calls":[{"from":"main","to":"maxCount","lines":[16]}],"fields":[],"source":"import java.io.*;\nimport java.util.StringTokenizer;\n\npublic class Main_2240_자두나무 {\n\n    public static void main(String[] args) throws IOException {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n        BufferedWriter bw = new BufferedWriter(new OutputS mbie zombie : zombies) {\n            int zx = zombie.x + zombie.dx;\n            if (zx \u003c 0 || zx >= n) {\n                zombie.dx = -zombie.dx;\n            } else {\n                zombieCount[zombie.x][zombie.y]--;\n                zombie.x = zx;\n                zombieCount[zombie.x][zombie.y]++;\n            }\n        }\n    }\n\n    static boolean encounterZombie(int x, int y) {\n        return !safeZone[x][y] && zombieCount[x][y] > 0;\n    }\n\n    static class Ahri {\n        int x = 0;\n        int y = 0;\n        int[] dx = {1, 0, -1, 0};\n        int[] dy = {0, 1, 0, -1};\n        int d = 0;\n        int n;\n\n        Ahri(int n) {\n            this.n = n;\n        }\n\n        void goFront() {\n            int nx = x + dx[d];\n            int ny = y + dy[d];\n            if (nx >= 0 && nx \u003c n && ny >= 0 && ny \u003c n) {\n                x = nx;\n                y = ny;\n            }\n        }\n\n        void turnLeft() {\n            d = (d + 1) % 4;\n        }\n\n        void turnRight() {\n            d = (d + 3) % 4;\n        }\n    }\n\n    static class Zombie {\n        int x;\n        int y;\n        int dx = 1;\n\n        Zombie(int x, int y) {\n            this.x = x;\n            this.y = y;\n        }\n    }\n}"},{"id":"Main_2305_자리배치","file":"Main_2305_자리배치.java","platform":"boj","num":2305,"title":"자리배치","extraTags":[],"explicit":[],"techs":["dp","prefix"],"evidence":{"dp":[19,21,33,34,38,39],"prefix":[17]},"first":"2025-05-12","last":"2025-05-12","commits":1,"commitMsg":"2305_자리배치","loc":43,"lines":50,"loopDepth":1,"io":["BufferedReader","BufferedWriter"],"mainClass":"Main_2305_","methods":[{"name":"main","ret":"void","params":"String[] args","line":5,"endLine":49,"owner":"Main_2305_","ctor":false,"size":45}],"classes":[],"calls":[],"fields":[],"source":"import java.io.*;\n\npublic class Main_2305_자리배치 {\n\n    public static void main(String[] args) throws IOException {\n        BufferedReader br = new BufferedReader(new In 03c>();\n        queue.offer(1);\n        int[] parent = new int[n * 2 + 1];\n        Arrays.fill(parent, -1);\n        parent[1] = 0;\n        while (!queue.isEmpty()) {\n            int current = queue.poll();\n            int offset = 0;\n            if(current \u003c= n ) offset = n;\n            for (int i = 1 + offset; i \u003c= n + offset; i++) {\n                if (road[current][i] > 0 && parent[i] == -1) {\n                    parent[i] = current;\n                    queue.offer(i);\n                }\n            }\n            if (parent[2 + n] != -1) {\n                break;\n            }\n        }\n        return parent;\n    }\n}"},{"id":"Main_2317_결혼식","file":"Main_2317_결혼식.java","platform":"boj","num":2317,"title":"결혼식","extraTags":[],"explicit":[],"techs":[],"evidence":{},"first":"2025-07-16","last":"2025-07-16","commits":1,"commitMsg":"2317_결혼식","loc":82,"lines":88,"loopDepth":1,"io":["BufferedReader","BufferedWriter"],"mainClass":"Main_2317_","methods":[{"name":"main","ret":"void","params":"String[] args","line":13,"endLine":37,"owner":"Main_2317_","ctor":false,"size":25},{"name":"getMinSub","ret":"long","params":"","line":39,"endLine":65,"owner":"Main_2317_","ctor":false,"size":27},{"name":"findMinPosition","ret":"long","params":"int n","line":67,"endLine":76,"owner":"Main_2317_","ctor":false,"size":10},{"name":"findMaxPosition","ret":"long","params":"int n","line":78,"endLine":87,"owner":"Main_2317_","ctor":false,"size":10}],"classes":[],"calls":[{"from":"main","to":"getMinSub","lines":[33]},{"from":"getMinSub","to":"findMinPosition","lines":[59]},{"from":"getMinSub","to":"findMaxPosition","lines":[62]}],"fields":[{"type":"int[]","name":"lions","line":6},{"type":"int[]","name":"people","line":7},{"type":"int","name":"max","line":8},{"type":"int","name":"min","line":9},{"type":"int","name":"lionMax","line":10},{"type":"int","name":"lionMin","line":11}],"source":"import java.io.*;\nimport java.util.StringTokenizer;\n\npublic class Main_2317_결         return subSum;\n    }\n\n    static long findMinPosition(int n) {\n        long findMinValue = Integer.MAX_VALUE;\n        for (int i = 1; i \u003c n; i++) {\n            long sub = Math.abs((long) Math.min(lions[i], lions[i - 1]) - min) * 2L;\n            findMinValue = Math.min(sub, findMinValue);\n        }\n        findMinValue = Math.min(findMinValue, (long) lions[n - 1] - min);\n        findMinValue = Math.min(findMinValue, (long) lions[0] - min);\n        return findMinValue;\n    }\n\n    static long findMaxPosition(int n) {\n        long findMinValue = Integer.MAX_VALUE;\n        for (int i = 1; i \u003c n; i++) {\n            long sub = Math.abs((long) max - (Math.max(lions[i], lions[i - 1]))) * 2L;\n            findMinValue = Math.min(sub, findMinValue);\n        }\n        findMinValue = Math.min(findMinValue, Math.abs((long) max - lions[n - 1]));\n        findMinValue = Math.min(findMinValue, Math.abs((long) max - lions[0]));\n        return findMinValue;\n    }\n}"},{"id":"Main_23256_성인게임","file":"Main_23256_성인게임.java","platform":"boj","num":23256,"title":"성인게임","extraTags":[],"explicit":[],"techs":["dp","math"],"evidence":{"dp":[25,26,28,29,34],"math":[24,28,29]},"first":"2025-10-07","last":"2025-10-07","commits":1,"commitMsg":"23256_성인게임","loc":31,"lines":36,"loopDepth":1,"io":["BufferedReader","BufferedWriter","StringBuilder"],"mainClass":"Main_23256_","methods":[{"name":"main","ret":"void","params":"String[] args","line":7,"endLine":20,"owner":"Main_23256_","ctor":false,"size":14},{"name":"fillDP","ret":"void","params":"","line":22,"endLine":31,"owner":"Main_23256_","ctor":false,"size":10},{"name":"solve","ret":"int","params":"int n","line":33,"endLine":35,"owner":"Main_23256_","ctor":false,"size":3}],"classes":[],"calls":[{"from":"main","to":"fillDP","lines":[12]},{"from":"main","to":"solve","lines":[15]}],"fields":[{"type":"long[][]","name":"dp","line":5}],"source":"import java.io.*;\n\npublic class Main_23256_성인게임 {\n\n    static long[][     if(dp[i][j] == MAX_VALUE) continue;\n                turnLeft(i, j, dp);\n                turnRight(i, j, dp);\n                turnBack(i, j, dp);\n            }\n        }\n        return dp[k][0] != MAX_VALUE ? dp[k][0] : -1;\n    }\n\n    static void turnLeft(int energy, int direction, int[][] dp) {\n        int newEnergy = energy + left;\n        int newDirection = turnLeftDirection(direction);\n        if (newEnergy > k) return;\n        dp[newEnergy][newDirection] = Math.min(dp[energy][direction] + 1, dp[newEnergy][newDirection]);\n    }\n\n    static int turnLeftDirection(int direction) {\n        return (direction + 3) % 4;\n    }\n\n    static void turnRight(int energy, int direction, int[][] dp) {\n        int newEnergy = energy + right;\n        int newDirection = turnRightDirection(direction);\n        if (newEnergy > k) return;\n        dp[newEnergy][newDirection] = Math.min(dp[energy][direction] + 1, dp[newEnergy][newDirection]);\n    }\n\n    static int turnRightDirection(int direction) {\n        return (direction + 1) % 4;\n    }\n\n    static void turnBack(int energy, int direction, int[][] dp) {\n        int newEnergy = energy + back;\n        int newDirection = turnBackDirection(direction);\n        if (newEnergy > k) return;\n        dp[newEnergy][newDirection] = Math.min(dp[energy][direction] + 1, dp[newEnergy][newDirection]);\n    }\n\n    static int turnBackDirection(int direction) {\n        return (direction + 2) % 4;\n    }\n}"},{"id":"Main_27211_도넛행성","file":"Main_27211_도넛행성.java","platform":"boj","num":27211,"title":"도넛행성","extraTags":[],"explicit":[],"techs":["bfs","grid"],"evidence":{"bfs":[47,50,55],"grid":[10,11]},"first":"2025-08-23","last":"2025-08-23","commits":1,"commitMsg":"27211_도넛행성","loc":56,"lines":61,"loopDepth":2,"io":["BufferedReader","BufferedWriter"],"mainClass":"Main_27211_","methods":[{"name":"main","ret":"void","params":"String[] args","line":13,"endLine":30,"owner":"Main_27211_","ctor":false,"size":18},{"name":    return count;\n    }\n\n    static void fill(int x, int y, int[][] map, Queue\u003cint[]> queue) {\n        queue.offer(new int[]{x, y});\n        map[x][y] = 1;\n        while (!queue.isEmpty()) {\n            int[] cur = queue.poll();\n            for (int i = 0; i \u003c 4; i++) {\n                int nx = (dx[i] + cur[0] + n) % n;\n                int ny = (dy[i] + cur[1] + m) % m;\n                if (map[nx][ny] == 0) {\n                    queue.offer(new int[]{nx, ny});\n                    map[nx][ny] = 1;\n                }\n            }\n        }\n    }\n}"},{"id":"Main_27315_틀리는건싫으니까","file":"Main_27315_틀리는건싫으니까.java","platform":"boj","num":27315,"title":"틀리는건싫으니까","extraTags":[],"explicit":[],"techs":["pq"],"evidence":{"pq":[3,21,22,23,57,63,72,99]},"first":"2025-06-02","last":"2025-06-02","commits":1,"commitMsg":"27315_틀리는건싫으니까","loc":105,"lines":118,"loopDepth":1,"io":["BufferedReader","BufferedWriter"],"mainClass":"Main_27315_","methods":[{"name":"main","ret":"void","params":"String[] args","line":12,"endLine":55,"owner":"Main_27315_","ctor":false,"size":44},{"name":"checkNormalQueue","ret":"void","params":"PriorityQueue\u003cProblem> queue, PriorityQueue\u003cProblem> possibleQueue","line":57,"endLine":61,"owner":"Main_27315_","ctor":false,"size":5},{"name":"checkEditorialQueue","ret":"void","params":"PriorityQueue\u003cProblem> queue, PriorityQueue\u003cProblem> possibleQueue","line":63,"endLine":70,"owner":"Main_27315_","ctor":false,"size":8},{"name":"solveProblem","ret":"int","params":"PriorityQueue\u003cProblem> queue, int goal","line":72,"endLine":91,"owner":"Main_27315_","ctor":false,"size":20},{"name":"solveSuccess","ret":"void","params":"","line":93,"endLine":97,"owner":"Main_27315_","ctor":false,"size":5},{"name":"solveOne","ret":"int","params":"PriorityQueue\u003cProblem> queue","line":99,"endLine":103,"owner":"Main_27315_","ctor":false,"size":5},{"name":"Problem","ret":"","params":"int ideaLevel, int solveLevel, int data, int editori n            problems[i] = new Problem(Integer.parseInt(st.nextToken()), Integer.parseInt(st.nextToken()), Integer.parseInt(st.nextToken()), Integer.parseInt(st.nextToken()));\n            if (problems[i].existEditorial) {\n                editorialQueue.offer(problems[i]);\n            } else {\n                normalQueue.offer(problems[i]);\n            }\n        }\n\n        st = new StringTokenizer(br.readLine());\n        idea = Integer.parseInt(st.nextToken());\n        solve = Integer.parseInt(st.nextToken());\n        while (true) {\n            checkNormalQueue(normalQueue, possibleQueue);\n            checkEditorialQueue(editorialQueue, possibleQueue);\n            int currentSolveCount = solveProblem(possibleQueue, m);\n            if (currentSolveCount == 0 || solveCount >= m) break;\n        }\n        long result = wrong;\n        if (solveCount \u003c m) {\n            result = -1;\n        }\n        bw.write(String.valueOf(result));\n        bw.close();\n        br.close();\n    }\n\n    static void checkNormalQueue(PriorityQueue\u003cProblem> queue, PriorityQueue\u003cProblem> possibleQueue) {\n        while (!queue.isEmpty() && queue.peek().ideaLevel \u003c= idea) {\n            possibleQueue.offer(queue.poll());\n        }\n    }\n\n    static void checkEditorialQueue(PriorityQueue\u003cProblem> queue, PriorityQueue\u003cProblem> possibleQueue) {\n        while (!queue.isEmpty() && queue.peek().ideaLevel \u003c= idea * 2) {\n            Problem problem = queue.poll();\n            problem.ideaLevel /= 2;\n            problem.solveLevel /= 2;\n            possibleQueue.offer(problem);\n        }\n    }\n\n    static int solveProblem(PriorityQueue\u003cProblem> queue, int goal) {\n        if (queue.isEmpty()) return 0;\n        int count = 0;\n        while (!queue.isEmpty()) {\n            Problem problem = queue.peek();\n            if (!problem.existData && problem.solveLevel > solve) {\n                break;\n            }\n            queue.poll();\n            count++;\n            solveSuccess();\n            if (solveCount == goal) {\n                return count;\n            }\n        }\n        if (count == 0) {\n            count = solveOne(queue);\n        }\n        return count;\n    }\n\n    static void solveSuccess() {\n        idea++;\n        solve++;\n        solveCount++;\n    }\n\n    static int solveOne(PriorityQueue\u003cProblem> queue) {\n        wrong += Objects.requireNonNull(queue.poll()).solveLevel - solve;\n        solveSuccess();\n        return 1;\n    }\n\n    static class Problem {\n        int ideaLevel;\n        int solveLevel;\n        boolean existData;\n        boolean existEditorial;\n\n        Problem(int ideaLevel, int solveLevel, int data, int editorial) {\n            this.ideaLevel = ideaLevel;\n            this.solveLevel = solveLevel;\n            this.existData = data > 0;\n            this.existEditorial = editorial > 0;\n        }\n    }\n}"},{"id":"Main_27498_연애혁명","file":"Main_27498_연애혁명.java","platform":"boj","num":27498,"title":"연애혁명","extraTags":[],"explicit":[],"techs":["dfs","uf","mst","sort"],"evidence":{"dfs":[73],"uf":[47,59,69],"mst":[28],"sort":[28]},"first":"2025-07-31","last":"2025-07-31","commits":1,"commitMsg":"27498_연애혁명","loc":80,"lines":89,"loopDepth":1,"io":["BufferedReader","BufferedWriter"],"mainClass":"Main_27498_","methods":[{"name":"main","ret":"void","params":"String[] args","line":10,"endLine":38,"owner":"Main_27498_","ctor":false,"size":29},{"name":"makeSet","ret":"void","params":"int n","line":40,"endLine":45,"owner":"Main_27498_","ctor":false,"size":6},{"name":"findMinRemoveLove","ret":"int","params":"int totalLoveAmount","line":47,"endLine":57,"owner":"Main_27498_","ctor":false,"size":11},{"name":"union","ret":"boolean","params":"int a, int b","line":59,"endLine":67,"owner":"Main_27498_","ctor":false,"size":9},{"name":"findSet","ret":"int","params":"int n","line":69,"endLine":74,"owner":"Main_27498_","ctor":false,"size":6},{" j][3] = used[i][j][0] = true;\n                            break;\n                        default:\n                            break;\n                    }\n                }\n            }\n        }\n        findTrack(0, 0, 0, required, grid);\n        return answer;\n    }\n\n    //direction 0:right 1:down 2:left 3:up\n    //used 0:가로 1:세로\n    void findTrack(int x, int y, int direction, int required, int[][] grid) {\n        if (x == n - 1 && y == m - 1 && required == 1) {\n            answer++;\n            return;\n        }\n        if (grid[x][y] == 0) {\n            for (int i = 0; i \u003c 4; i++) {\n                if (direction == (i + 2) % 4) continue;\n                int nx = x + dx[i];\n                int ny = y + dy[i];\n                if (nx \u003c 0 || ny \u003c 0 || nx >= n || ny >= m ||\n                        grid[nx][ny] == -1 || used[nx][ny][(i + 2) % 4]) continue;\n                if (direction == i) {\n                    used[x][y][i] = true;\n                    used[x][y][(i + 2) % 4] = true;\n                    findTrack(nx, ny, i, required, grid);\n                    used[x][y][i] = false;\n                    used[x][y][(i + 2) % 4] = false;\n                } else {\n                    Arrays.fill(used[x][y], true);\n                    findTrack(nx, ny, i, required, grid);\n                    Arrays.fill(used[x][y], false);\n                }\n            }\n        } else if (grid[x][y] == 3) {\n            int nx = x + dx[direction];\n            int ny = y + dy[direction];\n            if (nx \u003c 0 || ny \u003c 0 || nx >= n || ny >= m ||\n                    grid[nx][ny] == -1 || used[nx][ny][(direction + 2) % 4]) return;\n            used[x][y][direction] = true;\n            used[x][y][(direction + 2) % 4] = true;\n            findTrack(nx, ny, direction, required - 1, grid);\n            used[x][y][direction] = false;\n            used[x][y][(direction + 2) % 4] = false;\n        } else {\n            used[x][y][(direction + 2) % 4] = true;\n            for (int i = 0; i \u003c 4; i++) {\n                if (used[x][y][i]) continue;\n                int nx = x + dx[i];\n                int ny = y + dy[i];\n                if (nx \u003c 0 || ny \u003c 0 || nx >= n || ny >= m ||\n                        grid[nx][ny] == -1 || used[nx][ny][(i + 2) % 4]) continue;\n                used[x][y][i] = true;\n                findTrack(nx, ny, i, required - 1, grid);\n                used[x][y][i] = false;\n            }\n            used[x][y][(direction + 2) % 4] = false;\n        }\n    }\n}"},{"id":"Solution_등대","file":"Solution_등대.java","platform":"programmers","num":null,"title":"등대","extraTags":[],"explicit":[],"techs":["bfs","adj"],"evidence":{"bfs":[30,35,41],"adj":[62]},"first":"2026-07-20","last":"2026-07-20","commits":1,"commitMsg":"프로그래머스_등대","loc":62,"lines":67,"loopDepth":2,"io":[],"mainClass":"Solution_","methods":[{"name":"solution","ret":"int","params":"int n, int[][] lighthouse","line":4,"endLine":13,"owner":"Solution_","ctor":false,"size":10},{"name":"link","ret":"void","params":"Node[] nodes, int[][] lighthouse","line":15,"endLine":24,"owner":"Solution_","ctor":false,"size":10},{"name":"turnOnLight","ret":"void","params":"Node[] nodes","line":26,"endLine":46,"owner":"Solution_","ctor":false,"size":21},{"name":"countLight","ret":"int","params":"Node[] nodes, int[][] lighthouse","line":48,"endLine":59,"owner":"Solution_","ctor":false,"size":12}],"classes":[{"kind":"class","name":"Node","line":61,"endLine":66}],"calls":[{"from":"solution","to":"link","lines":[9]},{"from":"solution","to":"turnOnLight","lines":[10]},{"from":"solution","to":"countLight","lines":[11]}],"fields":[],"source":"import java.util.*;\n\nclass Solution_등대 {\n    public int solution(int n, int[][] lighthouse) {\n        Node[] nodes = new Node[n];\n        for (int i = 0; i \u003c n; i++) {\n            nodes[i] = new Node();\n        }\n        link(nodes, lighthouse);\n        turnOnLight(nodes);\n        int answer = countLight(nodes, lighthouse);\n        return answer;\n    }\n\n    void link(Node[] nodes, int[][] lighthouse) {\n        for (int[] road : lighthouse) {\n            int a = road[0] - 1;\n            int b = road[1] - 1;\n            nodes[a].next.add(nodes[b]);\n            nodes[a].link++;\n            nodes[b].next.add(nodes[a]);\n            nodes[b].link++;\n        }\n    }\n\n    void turnOnLight(Node[] nodes) {\n        Queue\u003cNode> queue = new ArrayDeque\u003c>();\n        for (Node node : nodes) {\n            if (node.link == 1) {\n                queue.offer(node);\n                node.isVisited = true;\n            }\n        }\n        while (!queue.isEmpty()) {\n            Node node = queue.poll();\n            for (Node n : node.next) {\n                if (n.isVisited) continue;\n                n.light = n.light | !node.light;\n                n.link--;\n                if (n.link == 1) {\n                    queue.offer(n);\n                    n.isVisited = true;\n                }\n            }\n        }\n    }\n\n    int countLight(Node[] nodes, int[][] lighthouse) {\n        int count = 0;\n        for (Node node : nodes) {\n            if (node.light) count++;\n        }\n        for (int[] n : lighthouse) {\n            Node a = nodes[n[0] - 1];\n            Node b = nodes[n[1] - 1];\n            if (!a.light && !b.light) count++;\n        }\n        return count;\n    }\n\n    class Node {\n        List\u003cNode> next = new ArrayList\u003c>();\n        int link = 0;\n        boolean light = false;\n        boolean isVisited = false;\n    }\n}"},{"id":"Solution_등산코스정하기","file":"Solution_등산코스정하기.java","platform":"programmers","num":null,"title":"등산코스정하기","extraTags":[],"explicit":[],"techs":["pq","dijkstra","sort","adj","hash"],"evidence":{"pq":[23],"dijkstra":[30,41],"sort":[49],"adj":[63],"hash":[20]},"first":"2026-07-16","last":"2026-07-16","commits":1,"commitMsg":"프로그래머스_등산코스정하기","loc":73,"lines":79,"loopDepth":2,"io":[],"mainClass":"Solution_","methods":[{"name":"solution","ret":"int[]","params":"int n, int[][] paths, int[] gates, int[] summits","line":3,"endLine":17,"owner":"Solution_","ctor":false,"size":15},{"name":"findAllMinIntensity","ret":"int[]","params":"int n, int[] gates, int[] summits, Node[] nodes","line":19,"endLine":46,"owner":"Solution_","ctor":false,"size":28},{"name":"findGoal","ret":"int[]","params":"int[] intensity, int[] summits","line":48,"endLine":59,"owner":"Solution_","ctor":false,"size":12},{"name":"Node","ret":"","params":"int index","line":65,"endLine":67,"owner":"Node","ctor":true,"size":3},{"name":"Course","ret":"","params":"int goal, int intensity","line":74,"endLine":77,"owner":"Course","ctor":true,"size":4}],"classes":[{"kind":"class","name":"Node","line":61,"endLine":68},{"kind":"class","name":"Course","line":70,"endLine":78}],"calls":[{"from":"solution","to":"findAllMinIntensity","lines":[14]},{"from":"solution","to":"findGoal","lines":[15]}],"fields":[],"source":"import java.util.*;\nclass Solution_등산코스정하기 {\n    public int[] solution(int n, int[][] paths, int[] gates, int[] summits) {\n        Node[] nodes = new Node[n];\n        for(int i = 0; i \u003c n; i++){\n            nodes[i] = new Node(i);\n        }\n        for(int[] path : paths){\n            int a = path[0] - 1;\n            int b = path[1] - 1;\n            nodes[a].next.add(new Course(b, path[2]));\n            nodes[b].next.add(new Course(a, path[2]));\n        }\n        int[] intensity = findAllMinIntensity(n, gates, summits, nodes);\n        int[] answer = findGoal(intensity, summits);\n        return answer;\n    }\n\n    int[] findAllMinIntensity(int n, int[] gates, int[] summits, Node[] nodes){\n        Set\u003cInteger> goals = new HashSet\u003c>();\n        int[] cost = new int[n];\n        Arrays.fill(cost, Integer.MAX_VALUE);\n        PriorityQueue\u003cCourse> pq = new PriorityQueue\u003c>((a, b)->{\n            if(a.intensity == b.intensity) return Integer.compare(a.goal, b.goal);\n            return Integer.compare(a.intensity, b.intensity);\n        });\n        for(int gate : gates){\n            int index = gate - 1;\n            pq.offer(new Course(index, 0));\n            cost[index] = 0;\n        }\n        for(int summit : summits){\n            goals.add(summit - 1);\n        }\n        while(!pq.isEmpty()){\n            Course course = pq.poll();\n            if(goals.contains(course.goal) || course.intensity > cost[course.goal]) continue;\n            for(Course next : nodes[course.goal].next){\n                int intensity = Math.max(next.intensity, course.intensity);\n                if(intensity >= cost[next.goal]) continue;\n                cost[next.goal] = intensity;\n                pq.offer(new Course(next.goal, intensity));\n            }\n        }\n        return cost;\n    }\n\n    int[] findGoal(int[] intensity, int[] summits){\n        Arrays.sort(summits);\n        int goal = 0;\n        int min = Integer.MAX_VALUE;\n        for(int summit : summits){\n            if(min > intensity[summit - 1]){\n                goal = summit;\n                min = intensity[summit - 1];\n            }\n        }\n        return new int[]{goal, min};\n    }\n\n    class Node {\n        int index;\n        List\u003cCourse> next = new ArrayList\u003c>();\n\n        Node(int index){\n            this.index = index;\n        }\n    }\n\n    class Course {\n        int goal;\n        int intensity;\n\n        Course (int goal, int intensity){\n            this.goal = goal;\n            this.intensity = intensity;\n        }\n    }\n}"},{"id":"Solution_미로탈출명령어","file":"Solution_미로탈출명령어.java","platform":"programmers","num":null,"title":"미로탈출명령어","extraTags":[],"explicit":[],"techs":["grid"],"evidence":{"grid":[4,5]},"first":"2025-08-22","last":"2025-08-22","commits":1,"commitMsg":"programmers_미로탈출명령어","loc":37,"lines":40,"loopDepth":2,"io":[],"mainClass":"Solution_","methods":[{"name":"solution","ret":"String","params":"int n, int m, int x, int y, int r, int c, int k","line":2,"endLine":26,"owner":"Solution_","ctor":false,"size":25},{"name":"isPossible","ret":"boolean","params":"int x, int y, int r, int c, int k","line":28,"endLine":31,"owner":"Solution_","ctor":false,"size":4},{"name":"isInDistance","ret":"boolean","params":"int x, int y, int r, int c, int k","line":33,"endLine":35,"owner":"Solution_","ctor":false,"size":3},{"name":"distance","ret":"int","params":"int x, int y, int r, int c","line":37,"endLine":39,"owner":"Solution_","ctor":false,"size":3}],"classes":[],"calls":[{"from":"solution","to":"isPossible","lines":[8]},{"from":"solution","to":"isInDistance","lines":[17]},{"from":"isPossible","to":"distance","lines":[29]},{"from":"isPossible","to":"isInDistance","lines":[30]},{"from":"isInDistance","to":"distance","lines":[34]}],"fields":[],"source":"class Solution_미로탈출명령어 {\n    public String solution(int n, int m, int x, int y, int r, int c, int k) {\n        String answer = \"\";\n        int[] dx = {1, 0, 0, -1};\n        int[] dy = {0, -1, 1, 0};\n        char[] d = {'d', 'l', 'r', 'u'};\n        char[] answerChar = new char[k];\n        boolean possible = isPossible(x, y, r, c, k);\n        if(!possible){\n            return \"impossible\";\n        }\n        for(int i = 0; i \u003c k; i++){\n            for(int j = 0; j \u003c 4; j++){\n                int nextX = x + dx[j];\n                int nextY = y + dy[j];\n                if(nextX \u003c= 0 || nextX > n || nextY \u003c= 0 || nextY > m) continue;\n                if(!isInDistance(nextX, nextY, r, c, k - i - 1)) continue;\n                answerChar[i] = d[j];\n                x = nextX;\n                y = nextY;\n                break;\n            }\n        }\n        answer = String.valueOf(answerChar);\n        return answer;\n    }\n\n    boolean isPossible(int x, int y, int r, int c, int k){\n        int distance = distance(x, y, r, c);\n        return isInDistance(x, y, r, c, k) && distance % 2 == k % 2;\n    }\n\n    boolean isInDistance(int x, int y, int r, int c, int k){\n        return distance(x, y, r, c) \u003c= k;\n    }\n\n    int distance(int x, int y, int r, int c){\n        return Math.abs(x - r) + Math.abs(y - c);\n    }\n}"},{"id":"Solution_발전소회로복구","file":"Solution_발전소회로복구.java","platform":"programmers","num":null,"title":"발전소회로복구","extraTags":[],"explicit":["bfs","bitmask"],"techs":["bfs","bitmask","dfs","dp","grid"],"evidence":{"dfs":[43],"bfs":[80,83,90,106,111,122],"dp":[29,38,39,43,45],"bitmask":[27,36,41,42,133],"grid":[74,75,100,101]},"first":"2026-07-14","last":"2026-07-14","commits":1,"commitMsg":"발전소회로복구(외판원 + bfs + bitmasking)","loc":140,"lines":150,"loopDepth":2,"io":[],"mainClass":"Solution_","methods":[{"name":"solution","ret":"int","params":"int h, String[] grid, int[][] panels, int[][] seqs","line":10,"endLine":33,"owner":"Solution_","ctor":false,"size":24},{"name":"find","ret":"int","params":"int cur, int bit","line":35,"endLine":46,"owner":"Solution_","ctor":false,"size":12},{"name":"findTime","ret":"int[][]","params":"Position elevator, char[][] map, int[][] panels","line":48,"endLine":68,"owner":"Solution_","ctor":false,"size":21},{"name":"findTimeFromElevator","ret":"int[][]","params":"char[][] map, Position elevator","line":70,"endLine":94,"owner":"Solution_","ctor":false,"size":25},{"name":"findTimeP2P","ret":"int","params":"char[][] map, Position a, Position b","line":96,"endLine":126,"owner":"Solution_","ctor":false,"size":31},{"name":"findPrevBit","ret":"int[]","params":"int k, int[][] seqs","line":128,"endLine":136,"owner":"Solution_","ctor":false,"size":9},{"name":"Position","ret":"","params":"","line":142,"endLine":143,"owner":"Position","ctor":true,"size":2},{"name":"Position","ret":"","params":"int x, int y","line":145,"endLine":148,"owner":"Position","ctor":true,"size":4}],"classes":[{"kind":"class","name":"Position","line":138,"endLine":149}],"calls":[{"from":"solution","to":"findTime","lines":[25]},{"from":"solution","to":"findPrevBit","lines":[26]},{"from":"solution","to":"find","lines":[31]},{"from":"find","to":"find","lines":[43]},{"from":"findTime","to":"findTimeFromElevator","lines":[51]},{"from":"findTime","to":"findTimeP2P","lines":[60]}],"fields":[{"type":"int","name":"MAX_VALUE","line":4},{"type":"int","name":"k","line":5},{"type":"int[]","name":"prev","line":6},{"type":"int[][]","name":"dp","line":7},{"type":"int[][]","name":"time","line":8}],"source":"import java.util.*;\n\nclass Solution_발전소회로복구 {\n    final int MAX_VALUE = Integer.MAX_VALUE >> 1;\n    int k;\n    int[] prev;\n    int[][] dp;\n    int[][] time;\n\n    public int solution(int h, String[] grid, int[][] panels, int[][] seqs) {\n        int n = grid.length;\n        int m = grid[0].length();\n        k = panels.length;\n        char[][] map = new char[n][m];\n        Position elevator = new Position();\n        for (int i = 0; i \u003c n; i++) {\n            for (int j = 0; j \u003c m; j++) {\n                map[i][j] = grid[i].charAt(j);\n                if (map[i][j] == '@') {\n                    elevator.x = i;\n                    elevator.y = j;\n                }\n            }\n        }\n        time = findTime(elevator, map, panels);\n        prev = findPrevBit(k, seqs);\n        dp = new int[k][1 \u003c\u003c k];\n        for (int i = 0; i \u003c k; i++) {\n            Arrays.fill(dp[i], MAX_VALUE);\n        }\n        int answer = find(0, 0);\n        return answer;\n    }\n\n    int find(int cur, int bit) {\n        if (bit == (1 \u003c\u003c k) - 1)\n            return 0;\n        if (dp[cur][bit] != MAX_VALUE)\n            return dp[cur][bit];\n        for (int i = 0; i \u003c k; i++) {\n            int check = 1 \u003c\u003c i;\n            if ((bit & check) != 0 || (bit & prev[i]) != prev[i]) continue;\n            dp[cur][bit] = Math.min(dp[cur][bit], find(i, (check | bit)) + time[i][cur]);\n        }\n        return dp[cur][bit];\n    }\n\n    int[][] findTime(Position elevator, char[][] map, int[][] panels) {\n        int k = panels.length;\n        int[][] distance = new int[k][k];\n        int[][] timeFromElevator = findTimeFromElevator(map, elevator);\n        Position[] positions = new Position[k];\n        for (int i = 0; i \u003c k; i++) {\n            positions[i] = new Position(panels[i][1] - 1, panels[i][2] - 1);\n            distance[i][i] = 0;\n        }\n        for (int i = 0; i \u003c k; i++) {\n            for (int j = i + 1; j \u003c k; j++) {\n                if (panels[i][0] == panels[j][0]) {\n                    distance[i][j] = distance[j][i] = findTimeP2P(map, positions[i], positions[j]);\n                } else {\n                    distance[i][j] = distance[j][i] =\n                            timeFromElevator[positions[i].x][positions[i].y] + timeFromElevator[positions[j].x][positions[j].y] + Math.abs(panels[i][0] - panels[j][0]);\n                }\n            }\n        }\n        return distance;\n    }\n\n    int[][] findTimeFromElevator(char[][] map, Position elevator) {\n        int n = map.length;\n        int m = map[0].length;\n        int[][] time = new int[n][m];\n        int[] dx = {0, 0, 1, -1};\n        int[] dy = {1, -1, 0, 0};\n        for (int i = 0; i \u003c n; i++) {\n            Arrays.fill(time[i], Integer.MAX_VALUE);\n        }\n        Queue\u003cPosition> queue = new ArrayDeque\u003c>();\n        queue.offer(elevator);\n        time[elevator.x][elevator.y] = 0;\n        while (!queue.isEmpty()) {\n            Position p = queue.poll();\n            for (int i = 0; i \u003c 4; i++) {\n                int nx = p.x + dx[i];\n                int ny = p.y + dy[i];\n                if (nx \u003c 0 || nx >= n || ny \u003c 0 || ny >= m ||\n                        time[nx][ny] != Integer.MAX_VALUE || map[nx][ny] == '#') continue;\n                time[nx][ny] = time[p.x][p.y] + 1;\n                queue.offer(new Position(nx, ny));\n            }\n        }\n        return time;\n    }\n\n    int findTimeP2P(char[][] map, Position a, Position b) {\n        int n = map.length;\n        int m = map[0].length;\n        int[][] time = new int[n][m];\n        int[] dx = {0, 0, 1, -1};\n        int[] dy = {1, -1, 0, 0};\n        for (int i = 0; i \u003c n; i++) {\n            Arrays.fill(time[i], MAX_VALUE);\n        }\n        Queue\u003cPosition> queue = new ArrayDeque\u003c>();\n        queue.offer(a);\n        time[a.x][a.y] = 0;\n        int result = -1;\n        main:\n        while (!queue.isEmpty()) {\n            Position p = queue.poll();\n            for (int i = 0; i \u003c 4; i++) {\n                int nx = p.x + dx[i];\n                int ny = p.y + dy[i];\n                if (nx \u003c 0 || nx >= n || ny \u003c 0 || ny >= m ||\n                        time[nx][ny] != MAX_VALUE || map[nx][ny] == '#') continue;\n                if (nx == b.x && ny == b.y) {\n                    result = time[p.x][p.y] + 1;\n                    break main;\n                }\n                time[nx][ny] = time[p.x][p.y] + 1;\n                queue.offer(new Position(nx, ny));\n            }\n        }\n        return result;\n    }\n\n    int[] findPrevBit(int k, int[][] seqs) {\n        int[] prev = new int[k];\n        for (int[] seq : seqs) {\n            int a = seq[0] - 1;\n            int b = seq[1] - 1;\n            prev[b] |= (1 \u003c\u003c a);\n        }\n        return prev;\n    }\n\n    class Position {\n        int x;\n        int y;\n\n        Position() {\n        }\n\n        Position(int x, int y) {\n            this.x = x;\n            this.y = y;\n        }\n    }\n}"},{"id":"Solution_보물찾기","file":"Solution_보물찾기.java","platform":"programmers","num":null,"title":"보물찾기","extraTags":[],"explicit":[],"techs":["dp","twoptr"],"evidence":{"dp":[10,11,18,19,20,21],"twoptr":[15]},"first":"2026-06-25","last":"2026-06-25","commits":1,"commitMsg":"프로그래머스_보물찾기","loc":42,"lines":44,"loopDepth":3,"io":[],"mainClass":"Solution_","methods":[{"name":"solution","ret":"int","params":"int[] depth, int money, Function\u003cInteger, Integer> excavate","line":5,"endLine":42,"owner":"Solution_","ctor":false,"size":38}],"classes":[],"calls":[],"fields":[],"source":"import java.util.function.Function;\nimport java.util.*;\n\nclass Solution_보물찾기 {\n    public int solution(int[] depth, int money, Function\u003cInteger, Integer> excavate) {\n        int w = depth.length;\n        int[][] dp = new int[w][w];\n        int[][] choice = new int[w][w];\n        for(int i = 0; i \u003c w; i++){\n            Arrays.fill(dp[i], Integer.MAX_VALUE);\n            dp[i][i] = depth[i];\n            choice[i][i] = i;\n        }\n        for(int size = 1; size \u003c w; size++){\n            for(int left = 0, right = left + size; left \u003c w && right \u003c w; left++, right++){\n                for(int point = left; point \u003c= right; point++){\n                    int cost = depth[point]\n                            + Math.max(left \u003c point ? dp[left][point - 1] : 0\n                            , point \u003c right ? dp[point + 1][right] : 0);\n                    if(cost \u003c dp[left][right]){\n                        dp[left][right] = cost;\n                        choice[left][right] = point;\n                    }\n                }\n            }\n        }\n        int result = 0;\n        int l = 0;\n        int r = w - 1;\n        while(l \u003c= r){\n            int position = choice[l][r];\n            result = excavate.apply(position + 1);\n            if(result == 0){\n                return position + 1;\n            } else if(result == -1){\n                r = position - 1;\n            } else{\n                l = position + 1;\n            }\n        }\n        return 0;\n    }\n\n}"},{"id":"Solution_봉인된주문","file":"Solution_봉인된주문.java","platform":"programmers","num":null,"title":"봉인된주문","extraTags":[],"explicit":[],"techs":["binsearch","sort"],"evidence":{"binsearch":[22],"sort":[6]},"first":"2025-08-10","l   tip.innerHTML = html; tip.style.opacity = 1;

  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}

function heatmap() {
  const counts = {};
  for (const p of P) if (p.first) counts[p.first] = (counts[p.first] || 0) + 1;
  const ds = Object.keys(counts).sort();
  if (!ds.length) return '';
  const day = 86400000;
  const start = new Date(ds[0] + 'T00:00:00Z');
  start.setUTCDate(start.getUTCDate() - start.getUTCDay()); // 일요일부터
  const endT = Date.parse(ds[ds.length - 1] + 'T00:00:00Z');
  let html = '<div class="heat-wrap"><div class="heat-days"><span></span><span></span><span>월</span><span></span><span>수</span><span></span><span>금</span><span></span></div><div class="heat">';
  let lastMonth = -1;
  for (let w = start.getTime(); w <= endT; w += 7 * day) {
    const wd = new Date(w);
    // 그 주에 1일이 들어 있으면 월 라벨
    let lab = '';
    for (let i = 0; i < 7; i++) {
      const dd = new Date(w + i * day);
      if (dd.getUTCMonth() !== lastMonth && (dd.getUTCDate() <= 7)) { lab = (dd.getUTCMonth() === 0 || lastMonth === -1 ? String(dd.getUTCFullYear()).slice(2) + '.' : '') + (dd.getUTCMonth() + 1) + '월'; lastMonth = dd.getUTCMonth(); break; }
    }
    html += `<div class="mlabel">${lab}</div>`;
    for (let i = 0; i < 7; i++) {
      const t = w + i * day;
      const iso = new Date(t).toISOString().slice(0, 10);
      if (t > endT) { html += '<div class="pad"></div>'; continue; }
      const n = counts[iso] || 0;
      const lv = n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4;
      html += `<div class="cell" data-d="${iso}"${n ? ` data-n="${n}"` : ''} style="background:var(--heat-${lv})" aria-label="${iso} ${n}문제"></div>`;
    }
    void wd;
  }
  return html + '</div></div>';
}

function monthlyChart(el) {
  const counts = {};
  for (const p of P) if (p.first) { const m = p.first.slice(0, 7); counts[m] = (counts[m] || 0) + 1; }
  const keys = Object.keys(counts).sort();
  if (!keys.length) return;
  // 빈 달도 채운다
  const months = [];
  let [y, m] = keys[0].split('-').map(Number);
  const [ey, em] = keys[keys.length - 1].split('-').map(Number);
  while (y < ey || (y === ey && m <= em)) { months.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } }
  const W = Math.max(280, el.clientWidth), H = 300, L = 30, R = 6, T = 10, B = 26;
  const max = Math.max(...months.map(k => counts[k] || 0));
  const step = max > 40 ? 20 : max > 20 ? 10 : 5;
  const top = Math.ceil(max / step) * step;
  const bw = (W - L - R) / months.length;
  const y0 = H - B, ys = v => y0 - (v / top) * (H - T - B);
  let s = `<svg class="bars-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="월별 풀이 수 막대 차트">`;
  for (let v = 0; v <= top; v += step) s += `<line class="${v ? 'gl' : 'base'}" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${v}</text>`;
  months.forEach((k, i) => {
    const v = counts[k] || 0, x = L + i * bw, w = Math.max(2, bw - 2), h = y0 - ys(v);
    const r = Math.min(4, w / 2, h);
    const path = v ? `M${x + 1},${y0} V${y0 - h + r} Q${x + 1},${y0 - h} ${x + 1 + r},${y0 - h} H${x + 1 + w - r} Q${x + 1 + w},${y0 - h} ${x + 1 + w},${y0 - h + r} V${y0} Z` : '';
    s += `<rect class="hit" data-k="${k}" data-v="${v}" x="${x}" y="${T}" width="${bw}" height="${y0 - T}" fill="transparent"/>`;
    s += v ? `<path class="bar" d="${path}"/>` : '<g class="bar"></g>';
    const mm = Number(k.slice(5));
    const every = bw >= 34 ? 1 : bw >= 16 ? 2 : 3;
    if (mm === 1 || i === 0 || (mm - 1) % every === 0) {
      s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${mm === 1 || i === 0 ? k.slice(2, 4) + '.' : ''}${mm}</text>`;
    }
  });
  el.innerHTML = s + '</svg>';
  el.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('mousemove', ev => { const [yy, mo] = r.dataset.k.split('-'); showTip(`<b>${yy}년 ${Number(mo)}월</b><br>${r.dataset.v}문제`, ev); });
    r.addEventListener('mouseleave', hideTip);
  });
}

function filtered() {

    if (state.day && p.first !== state.day) return false;
    for (const t of state.techs) if (!p.techs.includes(t)) return false;
    if (q) {
      const hay = [p.title, p.num ?? '', p.id, p.commitMsg, ...p.techs.map(tname), ...p.extraTags].join(' ').toLowerCase();
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const cmp = {
    new: (a, b) => (b.first || '').localeCompare(a.first || ''),
    old: (a, b) => (a.first || '').localeCompare(b.first || ''),
    num: (a, b) => (a.num ?? 1e9) - (b.num ?? 1e9) || a.title.localeCompare(b.title),
    long: (a, b) => b.loc - a.loc,
    edits: (a, b) => b.commits - a.commits || b.loc - a.loc,

}
